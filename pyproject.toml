[project]
name = "realtime-ai-chat"
version = "0.1.0"
description = "Real-time local speech-to-speech chat: Silero VAD + Parakeet (ONNX) -> local LLM -> Orpheus TTS"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "requests>=2.31",
    "onnx-asr[hub]>=0.12",
    # CUDA build with its CUDA/cuDNN runtime as pip packages (no toolkit install needed).
    # Kokoro on CUDA is ~3x faster than CPU; it also runs SNAC and, optionally, Parakeet.
    "onnxruntime-gpu[cuda,cudnn]>=1.24; sys_platform != 'darwin'",
    "onnxruntime>=1.20; sys_platform == 'darwin'",
    # Kokoro-82M TTS (fast, CPU-friendly alternative to Orpheus)
    "kokoro-onnx>=0.4",
    # speech server for Open WebUI
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",  # web UI
    "python-multipart>=0.0.9",
    "av>=12",
]

[project.scripts]
realtime-chat = "realtime_chat.main:main"
realtime-chat-server = "realtime_chat.server:main"
realtime-chat-web = "realtime_chat.web:main"
realtime-chat-setup = "realtime_chat.setup_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["realtime_chat"]

[tool.uv]
# kokoro-onnx and onnx-asr want stock onnxruntime, which would clobber the GPU build
# (same `onnxruntime` module). Only allow it on macOS, where there is no GPU build.
override-dependencies = ["onnxruntime>=1.20; sys_platform == 'darwin'"]
# NVIDIA sometimes publishes Linux wheels first; only pick versions that also exist for Windows
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
